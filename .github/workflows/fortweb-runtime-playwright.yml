name: FortWeb Runtime and Playwright Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fortweb-runtime-playwright:
    name: FortWeb Runtime and Playwright
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Build runtime
        run: npm run build:runtime

      - name: Check runtime JS
        run: npm run check:runtime-js

      - name: Test runtime JS check
        run: npm run test:runtime-js-check

      - name: Test runtime contract validation
        run: npm run test:contract

      - name: Test runtime closure
        run: npm run test:closure

      - name: Test Python dependency closure
        run: npm run test:python-deps

      - name: Test build idempotency
        run: npm run test:build-idempotency

      - name: Run Playwright fast tests
        run: npm run test:e2e

      - name: Run real Pyodide boot canary
        run: npm run test:e2e:slow

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-and-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
