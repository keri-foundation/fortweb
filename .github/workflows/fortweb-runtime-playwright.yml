name: FortWeb Runtime and Playwright Checks

on:
  pull_request:
  push:
    branches:
      - main
      - runtime-origin-contract-clean-shell-20260525-145142
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fortweb-runtime-playwright:
    name: FortWeb Runtime and Playwright
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Build runtime
        run: npm run build:runtime

      - name: Check runtime JS
        run: npm run check:runtime-js

      - name: Test runtime JS check
        run: npm run test:runtime-js-check

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-and-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
