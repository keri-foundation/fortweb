name: FortWeb Runtime and Playwright Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      runtime_source_url:
        description: Public HTTPS URL for the reviewed runtime source archive
        required: true
        type: string
      runtime_source_archive_sha256:
        description: SHA-256 digest of the runtime source archive
        required: true
        type: string
      runtime_source_manifest_sha256:
        description: SHA-256 digest of manifest.json inside the source archive
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fortweb-runtime-playwright:
    name: FortWeb Runtime and Playwright
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The reviewed runtime source pin, the runtime tree, and the canonical
      # package are produced by the shared producer action, so this workflow and
      # the publisher workflow cannot build different artifacts from the same
      # commit. The action also exports the FORTWEB_RUNTIME_SOURCE_* variables
      # that the runtime and wheelhouse steps below rely on.
      - name: Produce the canonical runtime package
        uses: ./.github/actions/produce-runtime-package
        with:
          runtime_source_url: ${{ inputs.runtime_source_url }}
          runtime_source_archive_sha256: ${{ inputs.runtime_source_archive_sha256 }}
          runtime_source_manifest_sha256: ${{ inputs.runtime_source_manifest_sha256 }}
          package_version: '0.0.0'
          ref: ${{ github.head_ref && format('refs/heads/{0}', github.head_ref) || github.ref }}

      # The acceptance sequence lives in one shared action so this PR lane and the
      # publisher's tag lane cannot drift into testing different things.
      - name: Validate the produced runtime
        uses: ./.github/actions/runtime-browser-acceptance
        with:
          label: pull-request

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-and-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
