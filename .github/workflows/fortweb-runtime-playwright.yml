name: FortWeb Runtime and Playwright Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fortweb-runtime-playwright:
    name: FortWeb Runtime and Playwright
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Build runtime
        run: npm run build:runtime

      - name: Check runtime JS
        run: npm run check:runtime-js

      - name: Test runtime JS check
        run: npm run test:runtime-js-check

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-and-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  runtime-contract-health:
    name: Runtime Contract Health
    runs-on: ubuntu-latest
    needs: fortweb-runtime-playwright
    if: always() && !cancelled()
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build runtime
        run: npm run build:runtime

      - name: Run runtime-package tests
        run: npm run test:runtime-package

      - name: Run verifier tests
        run: npm run test:runtime-package-verify

      - name: Generate runtime package
        run: npm run package:runtime

      - name: Verify runtime package
        run: npm run verify:runtime-package .tmp/runtime-packages/fortweb-runtime-*.zip

      - name: Contract health summary
        if: always()
        run: |
          ZIP=$(ls .tmp/runtime-packages/fortweb-runtime-*.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then
            echo "### Runtime Contract Health :x: PACKAGE NOT FOUND" >> "$GITHUB_STEP_SUMMARY"
            echo "No runtime package was generated. Check earlier steps for failures." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          RR_PATH="contracts/runtime-requirements.json"
          RR_TEXT=$(unzip -p "$ZIP" "fortweb-runtime/$RR_PATH" 2>/dev/null)
          if [ -z "$RR_TEXT" ]; then
            echo "### Runtime Contract Health :x: CONTRACT NOT FOUND" >> "$GITHUB_STEP_SUMMARY"
            echo "Contract not found at fortweb-runtime/$RR_PATH" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          SCHEMA=$(echo "$RR_TEXT" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).schema")
          VERSION=$(echo "$RR_TEXT" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version")
          PRODUCER=$(echo "$RR_TEXT" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).producer")
          PROFILE=$(echo "$RR_TEXT" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).payload_profile")
          CAP_COUNT=$(echo "$RR_TEXT" | node -p "Object.keys(JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).capabilities).length")
          FB_COUNT=$(echo "$RR_TEXT" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).forbidden_behaviors.length")
          RR_BYTES=$(printf '%s' "$RR_TEXT" | wc -c | tr -d ' ')
          RR_SHA=$(printf '%s' "$RR_TEXT" | shasum -a 256 | awk '{print $1}')
          echo "### Runtime Contract Health :white_check_mark: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Contract path | \`$RR_PATH\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Schema | \`$SCHEMA\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | $VERSION |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Producer | \`$PRODUCER\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Payload profile | \`$PROFILE\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Capability count | $CAP_COUNT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Forbidden-behavior count | $FB_COUNT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Inventory entries | 1 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Byte count | $RR_BYTES |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SHA-256 | \`$RR_SHA\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Canonical verifier | PASS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Contract health | PASS |" >> "$GITHUB_STEP_SUMMARY"
