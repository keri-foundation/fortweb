name: FortWeb Runtime and Playwright Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fortweb-runtime-playwright:
    name: FortWeb Runtime and Playwright
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Build runtime
        run: npm run build:runtime

      - name: Check runtime JS
        run: npm run check:runtime-js

      - name: Test runtime JS check
        run: npm run test:runtime-js-check

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-and-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  runtime-contract-health:
    name: Runtime Contract Health
    runs-on: ubuntu-latest
    needs: fortweb-runtime-playwright
    if: always() && !cancelled()
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build runtime
        run: npm run build:runtime

      - name: Run runtime-package tests
        run: npm run test:runtime-package

      - name: Generate runtime package
        run: npm run package:runtime

      - name: Run verifier tests
        run: npm run test:runtime-package-verify

      - name: Run contract-health tests
        run: npm run test:runtime-contract-health

      - name: Run contract health check
        id: health
        run: |
          ZIP=$(ls .tmp/runtime-packages/fortweb-runtime-*.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then
            echo "PACKAGE_FOUND=false" >> "$GITHUB_OUTPUT"
            echo "### Runtime Contract Health :x: FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "No runtime package was generated." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          RESULT=$(node tools/runtime-contract-health.mjs "$ZIP" 2>/tmp/health-err.log)
          HEALTH_EXIT=$?
          if [ $HEALTH_EXIT -ne 0 ]; then
            echo "PACKAGE_FOUND=true" >> "$GITHUB_OUTPUT"
            echo "### Runtime Contract Health :x: FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/health-err.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "PACKAGE_FOUND=true" >> "$GITHUB_OUTPUT"
          echo "$RESULT" > /tmp/health-result.json

      - name: Contract health summary
        if: success()
        run: |
          RESULT=$(cat /tmp/health-result.json)
          SCHEMA=$(echo "$RESULT" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).schema")
          VERSION=$(echo "$RESULT" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version")
          PRODUCER=$(echo "$RESULT" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).producer")
          PROFILE=$(echo "$RESULT" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).payload_profile")
          CAP_COUNT=$(echo "$RESULT" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).capability_count")
          FB_COUNT=$(echo "$RESULT" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).forbidden_behavior_count")
          INV=$(echo "$RESULT" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).inventory_entries")
          ACT_BYTES=$(echo "$RESULT" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).actual_bytes")
          MAN_BYTES=$(echo "$RESULT" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).manifest_bytes")
          ACT_SHA=$(echo "$RESULT" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).actual_sha256")
          MAN_SHA=$(echo "$RESULT" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).manifest_sha256")
          echo "### Runtime Contract Health :white_check_mark: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Contract path | \`contracts/runtime-requirements.json\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Schema | \`$SCHEMA\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | $VERSION |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Producer | \`$PRODUCER\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Payload profile | \`$PROFILE\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Capability count | $CAP_COUNT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Forbidden-behavior count | $FB_COUNT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Inventory entries | $INV |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Actual byte count | $ACT_BYTES |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Manifest byte count | $MAN_BYTES |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Actual SHA-256 | \`$ACT_SHA\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Manifest SHA-256 | \`$MAN_SHA\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Canonical verifier | PASS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Contract health | PASS |" >> "$GITHUB_STEP_SUMMARY"
